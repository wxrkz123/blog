<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>页面不存在 | Wxrkz</title>
    <link rel="icon" type="image/png" href="/blog/favicon.png">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #4cbf30 0%, #0f9d58 100%); color: #34495e; padding: 16px;
        }
        .card {
            background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
            max-width: 560px; width: 100%; padding: 32px 28px; text-align: center;
        }
        h1 { font-size: 64px; margin: 0; color: #0f9d58; letter-spacing: 4px; }
        h2 { font-size: 20px; margin: 8px 0 20px; font-weight: 600; }
        #status { color: #7f8c8d; min-height: 1.5em; }
        #suggestions { list-style: none; padding: 0; margin: 16px 0; text-align: left; }
        #suggestions li { margin: 8px 0; }
        a { color: #0f9d58; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .links { margin-top: 20px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .links a { border: 1px solid #0f9d58; border-radius: 20px; padding: 6px 16px; }
    </style>
</head>
<body>
<div class="card">
    <h1>404</h1>
    <h2>抱歉，你访问的页面不存在</h2>
    <p id="status">正在尝试为你找到正确的页面……</p>
    <ul id="suggestions"></ul>
    <div class="links">
        <a href="/blog/">返回首页</a>
        <a href="/blog/archives/">文章归档</a>
        <a href="/blog/categories/">分类</a>
    </div>
</div>
<script>
(function () {
    var BASE = '/blog/';
    var path = location.pathname;
    var status = document.getElementById('status');

    // 常见的“链接被弄坏”的情况，按顺序生成候选地址
    var candidates = [];
    function add(p) {
        if (p && p !== path && candidates.indexOf(p) < 0) candidates.push(p);
    }
    // 1. 中文路径被部分浏览器或 App 二次编码：%25E8%25B6... -> %E8%B6...
    if (/%25[0-9A-Fa-f]{2}/.test(path)) add(path.replace(/%25([0-9A-Fa-f]{2})/g, '%$1'));
    // 2. 缺少结尾的斜杠
    if (!/\/$/.test(path) && !/\.[A-Za-z0-9]+$/.test(path)) add(path + '/');
    // 3. 分享时在链接末尾粘上了标点或多余字符，例如 .../xxx/）
    add(path.replace(/\/[^\/]*$/, '/'));

    function exists(url) {
        return fetch(url, { method: 'HEAD', cache: 'no-store' })
            .then(function (r) { return r.ok; })
            .catch(function () { return false; });
    }

    function tryCandidates(i) {
        if (i >= candidates.length) return suggest();
        var target = candidates[i];
        if (target === BASE) return tryCandidates(i + 1);   // 不要把所有错误都“修复”成首页
        return exists(target).then(function (ok) {
            if (ok) {
                status.textContent = '找到了，正在跳转……';
                location.replace(target + location.search + location.hash);
            } else {
                return tryCandidates(i + 1);
            }
        });
    }

    // 实在找不到时，根据地址中的关键词，从站内搜索索引里推荐文章
    function suggest() {
        var words = decodeURIComponent(path.replace(BASE, '')).split(/[\/\-_\s]+/).filter(function (w) {
            return w && !/^\d+$/.test(w);
        }).map(function (w) { return w.toLowerCase(); });
        if (!words.length) {
            status.textContent = '这个页面可能已被移动或删除。';
            return;
        }
        fetch(BASE + 'search.xml').then(function (r) { return r.text(); }).then(function (text) {
            var xml = new DOMParser().parseFromString(text, 'text/xml');
            var scored = Array.prototype.map.call(xml.getElementsByTagName('entry'), function (entry) {
                var title = entry.getElementsByTagName('title')[0].textContent;
                var url = entry.getElementsByTagName('url')[0].textContent;
                var haystack = (title + ' ' + decodeURIComponent(url)).toLowerCase();
                var score = words.filter(function (w) { return haystack.indexOf(w) >= 0; }).length;
                return { title: title, url: url, score: score };
            }).filter(function (e) { return e.score > 0; })
              .sort(function (a, b) { return b.score - a.score; })
              .slice(0, 5);
            if (!scored.length) {
                status.textContent = '这个页面可能已被移动或删除。';
                return;
            }
            status.textContent = '你要找的也许是：';
            var list = document.getElementById('suggestions');
            scored.forEach(function (e) {
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.href = e.url;
                a.textContent = e.title;
                li.appendChild(a);
                list.appendChild(li);
            });
        }).catch(function () {
            status.textContent = '这个页面可能已被移动或删除。';
        });
    }

    tryCandidates(0);
})();
</script>
</body>
</html>
